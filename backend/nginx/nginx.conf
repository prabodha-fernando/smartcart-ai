events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream definitions for Node.js microservices
    upstream auth_service {
        server host.docker.internal:4001 max_fails=0;
    }

    upstream order_service {
        server host.docker.internal:4002 max_fails=0;
    }

    upstream ai_service {
        server host.docker.internal:4003 max_fails=0;
    }

    server {
        listen 4000;
        server_name localhost;

        # CORS is handled by the downstream Node.js microservices (Express cors middleware)

        # -----------------------------------------------------------------
        # 1. Auth Service Routing (Port 4001)
        # -----------------------------------------------------------------
        location /api/auth {
            proxy_pass http://auth_service/api/auth;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # -----------------------------------------------------------------
        # 2. Order & Catalog Service Routing (Port 4002)
        # -----------------------------------------------------------------
        location /api/products {
            proxy_pass http://order_service/api/products;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/threads {
            proxy_pass http://order_service/api/threads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/cart {
            proxy_pass http://order_service/api/cart;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/orders {
            proxy_pass http://order_service/api/orders;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/wishlist {
            proxy_pass http://order_service/api/wishlist;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # -----------------------------------------------------------------
        # 3. AI Service Routing (Port 4003) - Pure REST API
        # -----------------------------------------------------------------
        location /api/ai {
            proxy_pass http://ai_service/api/ai;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check endpoint for Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"NGINX"}';
        }
    }
}
